<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Discover Ogbogu — Ogbogu Chamber</title>
  <meta name="description" content="Discover Ogbogu: local attractions, services, and places of interest curated by the Ogbogu Chamber of Commerce." />
  <link rel="icon" href="images/favicon.ico" />

  <!-- existing global styles -->
  <link rel="stylesheet" href="styles/styles.css">

  <!-- discover page specific CSS -->
  <link rel="stylesheet" href="styles/discover.css">

  <!-- module script: imports data from ./data/places.mjs -->
  <script type="module" defer src="scripts/discover.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Ogbogu Chamber of Commerce</h1>
      <nav class="main-nav" aria-label="Main Navigation">
        <ul id="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="directory.html">Directory</a></li>
          <li><a href="events.html">Events</a></li>
          <li><a href="join.html">Join</a></li>
          <li><a href="discover.html" aria-current="page">Discover</a></li>
        </ul>
        <button id="menu-toggle" aria-expanded="false" aria-controls="nav-links">☰</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <img src="images/discover-hero.jpeg" alt="Aerial view of Ogbogu" class="hero-image">
      <div class="hero-overlay">
        <div class="hero-text">
          <h1>Discover Ogbogu</h1>
          <p>Explore the places, culture, and businesses that make our community unique.</p>
        </div>
      </div>
    </section>

    <section class="section-box">
      <div id="visit-message" class="visit-message" role="status" aria-live="polite">
        <!-- localStorage message will appear here -->
      </div>

      <!-- discover grid container -->
      <div id="discover-grid" class="discover-grid" aria-live="polite">
        <!-- Cards injected here by scripts/discover.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; <span id="year"></span> — Ogbogu Chamber of Commerce — Nigeria</p>
    </div>
  </footer>

  <!-- small generic footer date script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();
      // basic mobile menu
      const menuToggle = document.getElementById('menu-toggle');
      const navLinks = document.getElementById('nav-links');
      if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', () => {
          const open = navLinks.classList.toggle('open');
          menuToggle.setAttribute('aria-expanded', open);
        });
      }
    });
  </script>
</body>
</html>
